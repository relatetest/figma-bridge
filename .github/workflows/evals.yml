name: evals

# Paid runs: only on the run-evals label or by hand, and only for the skills a PR touches.
on:
  pull_request:
    types: [labeled, synchronize]
  workflow_dispatch:
    inputs:
      skill:
        description: Skill name (tag), e.g. relate-brand-voice. Empty = every skill.
        required: false

permissions:
  contents: read

jobs:
  evals:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'run-evals')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: evals
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Pick skills to evaluate
        id: pick
        env:
          INPUT_SKILL: ${{ github.event.inputs.skill }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$INPUT_SKILL" ]; then
            tags="$INPUT_SKILL"
          elif [ -n "$BASE" ]; then
            tags=$(git diff --name-only "$BASE" HEAD -- skills evals | cut -d/ -f2 | grep '^relate-' | sort -u | tr '\n' ' ' || true)
          else
            tags=""
          fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
          echo "Skills: ${tags:-all}"

      - name: Run evals
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TAGS: ${{ steps.pick.outputs.tags }}
        run: |
          args=""
          for t in $TAGS; do args="$args --tag $t"; done
          npx -y @anthropic-ai/claude-code@2.1.318 plugin eval . $args \
            --trust-plugin \
            --json evals-result.json \
            --threshold 0.8 \
            --model claude-sonnet-5-5 \
            --judge-model claude-haiku-5-5 \
            --no-publish \
            --max-cost-usd 15

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: evals-report
          path: |
            evals-result.json
            evals/results/
          if-no-files-found: ignore
