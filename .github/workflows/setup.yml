name: setup

# Runs once in a repo created with "Use this template": puts the repo name and its creator into
# relate.config.json, README.md and AGENTS.md. After that relate.config.json no longer points at
# the template and every later run exits at the first step.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  setup:
    if: github.repository != 'relatetest/template-plugin'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Already set up?
        id: state
        run: |
          if grep -q '"repo": "relatetest/template-plugin"' relate.config.json; then
            echo "todo=true" >> "$GITHUB_OUTPUT"
          else
            echo "todo=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v7
        if: steps.state.outputs.todo == 'true'
        with:
          node-version: 22

      - name: Set up from template
        if: steps.state.outputs.todo == 'true'
        run: node scripts/setup.mjs

      - name: Commit
        if: steps.state.outputs.todo == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: set up from template"
          git push
